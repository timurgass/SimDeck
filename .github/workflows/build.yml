name: Build SimDeck
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tools/qa/generate-fs25-registry.py --check
      - run: python tools/qa/check-vehicle-mods.py
      - run: dotnet run --project companion/SimDeck.Tests/SimDeck.Tests.csproj -c Release
      - run: dotnet publish companion/SimDeck.App/SimDeck.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Companion
      - name: Bundle USB bridge
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Android SDK is required to package the USB bridge' }
          $source = Join-Path $sdk 'platform-tools'
          $destination = 'artifacts/Companion/platform-tools'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($name in @('adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll','libwinpthread-1.dll','NOTICE.txt')) {
            $file = Join-Path $source $name
            if (Test-Path $file) { Copy-Item -LiteralPath $file -Destination $destination }
            elseif ($name -ne 'libwinpthread-1.dll') { throw "Missing Android platform tool: $name" }
          }
      - run: dotnet run --project companion/SimDeck.Tests/SimDeck.Tests.csproj -c Release --no-build -- --render-editor artifacts/companion-preview.png
      - run: dotnet run --project companion/SimDeck.Tests/SimDeck.Tests.csproj -c Release --no-build -- --smoke-app artifacts/Companion/SimDeck.exe artifacts/smoke-state
      - run: dotnet run --project companion/SimDeck.Tests/SimDeck.Tests.csproj -c Release --no-build -- --smoke-startup-failure artifacts/Companion/SimDeck.exe artifacts/smoke-failed-state
      - uses: actions/upload-artifact@v4
        with:
          name: SimDeck-Windows
          path: artifacts/Companion
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: SimDeck-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
