name: Build SimDeck
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet run --project companion/SimDeck.Tests/SimDeck.Tests.csproj -c Release
      - run: dotnet publish companion/SimDeck.App/SimDeck.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Companion
      - uses: actions/upload-artifact@v4
        with:
          name: SimDeck-Windows
          path: artifacts/Companion
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: SimDeck-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
