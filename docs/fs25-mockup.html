<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SimDeck · Farming Simulator 25 — макет</title>
<style>
/* Палитра SimDeck, сдвинутая в землистые тона. Гоночные игры своего вида не теряют:
   всё ниже действует только внутри раздела FS25. */
:root{
  color-scheme:dark;
  --bg:#12150f; --card:#1c2117; --card2:#171b13; --line:#2f3a26;
  --ink:#eef1e6; --mute:#a9b39a;
  --gold:#d9b74a; --green:#7ea653; --mint:#9dd6a8;
  --warn:#e0a04a; --danger:#d4703f;
  --paper:#e8dfc8; --paperInk:#3a3226;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px;
}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:
    radial-gradient(1200px 600px at 80% -10%, #1d2416 0%, transparent 60%),
    var(--bg);}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
header strong{font-size:22px;letter-spacing:1px}
header small{display:block;color:var(--mute);font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
#conn{font-size:12px;text-align:right;color:var(--mint);max-width:46%}
main{max-width:1180px;margin:auto;padding:16px 20px 40px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:#12150fe6;backdrop-filter:blur(8px);z-index:10;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#4a5a3c transparent}
/* На телефоне прокрутка пальцем работает, мышью — нет. Поэтому полоса видимая,
   а на широком экране вкладки просто переносятся на вторую строку. */
nav::-webkit-scrollbar{height:6px}
nav::-webkit-scrollbar-thumb{background:#4a5a3c;border-radius:6px}
nav::-webkit-scrollbar-track{background:transparent}
@media(min-width:620px){ nav{flex-wrap:wrap;overflow:visible} }
nav button{white-space:nowrap;font:inherit;font-size:14px;padding:10px 15px;color:var(--mute);
  border:1px solid var(--line);background:var(--card2);border-radius:13px;cursor:pointer}
nav button.on{background:var(--gold);color:#1a1a12;border-color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.card.tight{padding:14px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:18px 0 8px;color:var(--mute);letter-spacing:.5px;text-transform:uppercase;font-size:12px}
p{line-height:1.55;margin:8px 0}
.eyebrow{display:block;font-size:11px;letter-spacing:1.4px;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
small{display:block;color:var(--mute);font-size:13px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #4a5a3c;background:#26301f;border-radius:13px;
  padding:14px 16px;min-height:52px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,button.down{background:#38452c;transform:translateY(1px)}
/* Брифинг */
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.hero .day{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px}
.hero .day span{color:var(--gold)}
.wx{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mute)}
.wx b{color:var(--ink);font-weight:600}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.money div{background:var(--card2);border-radius:12px;padding:12px}
.money strong{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:3px}
.money .loan strong{color:var(--warn)}
/* Задачи */
.task{display:grid;grid-template-columns:8px 1fr;gap:12px;background:var(--card2);border-radius:14px;
  padding:14px;margin:10px 0;align-items:start}
.task .bar{width:8px;border-radius:8px;align-self:stretch;min-height:44px}
.task.urgent .bar{background:var(--danger)} .task.soon .bar{background:var(--warn)}
.task.ok .bar{background:var(--green)} .task.done .bar{background:#4a5a3c}
.task b{display:block;font-size:16px;margin-bottom:4px}
.task.done b{text-decoration:line-through;color:var(--mute)}
.chip{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;
  border-radius:20px;border:1px solid var(--line);color:var(--mute);margin-top:8px}
.chip.plan{border-color:#5a6a45;color:var(--mint)}
.chip.fix{border-color:var(--warn);color:var(--warn)}
.taskFoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.taskFoot .chip{margin-top:0}
.jump{font-size:11px;padding:5px 10px;min-height:auto;border-radius:20px;color:var(--mute);
  background:transparent;border:1px solid var(--line)}
.jump:active{background:#2b3524}
.grp{margin:22px 0 4px;padding-left:12px;border-left:4px solid var(--line)}
.grp h3{margin:0 0 2px;font-size:13px;letter-spacing:.6px;color:var(--ink)}
.grp small{font-size:12px}
.grp.urgent{border-left-color:var(--danger)} .grp.soon{border-left-color:var(--warn)}
.grp.ok{border-left-color:var(--green)} .grp.done{border-left-color:#4a5a3c;opacity:.65}
.dont{background:#241a16;border:1px solid #4a3128;border-radius:14px;padding:14px;margin:10px 0}
.dont b{display:block;color:#f0a98a;margin-bottom:5px}
.countdown{margin-top:16px;padding:14px;border-radius:14px;background:#2a2113;border:1px solid #5c4a24}
.countdown b{display:block;color:var(--gold);margin-bottom:4px}
.planCard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.planCard.warnCard{background:#241f13;border-color:#5c4a24}
.planTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.planTop b{font-size:17px}
.steps{display:grid;gap:8px;margin:10px 0 16px}
.steps div{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;
  background:var(--card2);border-radius:11px;padding:12px;font-size:14px}
.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#1a1a12;font-size:13px}
.wideBtn{width:100%;background:var(--gold);color:#1a1a12;border-color:var(--gold);font-weight:700}
.wideBtn.done{background:var(--mint);border-color:var(--mint)}
.copyHint{display:block;margin-top:10px;font-size:12px;line-height:1.55}
.fmt{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.fmtHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fmtHead span{font-size:14px} .fmtHead b{color:var(--gold)}
.fmt small{display:block;margin-top:9px}
.code{background:#0e120c;border:1px solid var(--line);border-radius:10px;padding:13px;margin:11px 0 0;
  font-family:ui-monospace,"Courier New",monospace;font-size:11.5px;line-height:1.55;color:#c9d6bd;
  overflow-x:auto;white-space:pre;-webkit-overflow-scrolling:touch}
/* Галочки на задачах */
.tick{display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-bottom:4px}
.tick input{width:21px;height:21px;flex:none;margin:1px 0 0;accent-color:var(--green);cursor:pointer}
.tick.auto{cursor:default}
.tick.auto input{cursor:default}
.tick b{margin:0}
.task.done .tick b{text-decoration:line-through;color:var(--mute)}
.task.done small{opacity:.7}
small.kit{margin-top:6px;color:var(--mint)}
/* Что изменилось */
.diff{display:grid;gap:7px;margin-top:10px}
.diff div{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--card2);
  border-radius:10px;padding:11px 13px}
.diff i{width:8px;height:8px;border-radius:50%;flex:none}
.diff .good i{background:var(--mint)} .diff .bad i{background:var(--danger)}
.diff .flat i{background:#4a5a3c}
.diff .bad{color:#f0a98a}
/* Режим в поле */
.modeSwitch{width:100%;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:14px;color:var(--mute);background:var(--card2)}
.modeSwitch.on{background:var(--green);color:#111508;border-color:var(--green);font-weight:700}
.modeSwitch span{font-size:17px}
/* Главный ответ режима: работаете вы сейчас или едете впустую */
.status{width:100%;display:block;text-align:center;border-radius:18px;padding:22px 18px;margin-bottom:12px}
.status b{display:block;font-size:46px;line-height:1;letter-spacing:1px;font-weight:800}
.status small{font-size:15px;margin-top:8px}
.status.go{background:#173a24;border:2px solid var(--mint)}
.status.go b{color:var(--mint)}
.status.stop{background:#3a1f16;border:2px solid var(--danger)}
.status.stop b{color:#ff9d72}
.status.stop small{color:#f0b89e}
.doing{text-align:center;color:var(--mute);font-size:14px;margin-bottom:16px}
.levels{display:grid;gap:12px;margin-bottom:16px}
.levels > div{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;
  background:var(--card2);border-radius:12px;padding:12px 14px}
.levels span{font-size:13px;color:var(--mute)}
.levels b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.levels small{grid-column:2 / -1;font-size:12px;margin-top:-2px}
.lvl{height:9px;border-radius:6px;background:#0f1410;overflow:hidden}
.lvl i{display:block;height:100%;background:var(--green);border-radius:6px}
.lvl.speed i{background:var(--gold)}
.bigGrid .act{min-height:110px;font-size:17px}
.nextLine{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.nextLine .eyebrow{margin:0}
/* Удержание отличается от импульса и на вид */
.act{position:relative}
.act.holdBtn{border-style:dashed;border-color:#6f7f57}
.act.holdBtn:active,.act.holdBtn.down{background:#3d5230;border-style:solid}
.gest{position:absolute;top:7px;right:9px;font-size:9px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--mute);opacity:.85}
/* Поля */
svg.map{display:block;width:100%;height:auto;background:#141810;border-radius:16px}
svg.map polygon{cursor:pointer;stroke:#0d100a;stroke-width:1.5;transition:filter .12s}
svg.map polygon:hover{filter:brightness(1.25)}
svg.map polygon.mine{stroke:var(--gold);stroke-width:3}
svg.map polygon.sel{stroke:#fff;stroke-width:3.5}
svg.map text{font-size:9px;fill:#0d100a;font-weight:700;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
/* Показатели поля: доля, слово и стрелка изменения с прошлого сохранения */
.gauge4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.statTop{display:flex;justify-content:space-between;align-items:center;gap:6px}
.statTop span{font-size:12px;color:var(--mute)}
.stat strong{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:4px 0 7px}
.stat .lvl{height:6px}
.stat .lvl i.good{background:var(--mint)} .stat .lvl i.warnc{background:var(--warn)}
.stat .lvl i.bad{background:var(--danger)}
.stat small{font-size:12px;margin-top:6px}
.delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.bad{color:var(--danger)} .delta.good{color:var(--mint)}
/* Урожай: ожидание, разбор потерь, факт */
.yield{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:8px}
.yTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
  padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.yTop b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:3px}
.yAct{text-align:right;position:relative}
.yPct{display:inline-block;font-size:12px;font-weight:700;margin-top:3px}
.yBase{font-size:12px;color:var(--mute);margin-bottom:9px}
.yRow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0}
.yRow b{font-variant-numeric:tabular-nums}
.yRow.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:600}
.yield > small{display:block;margin-top:10px;font-size:12px}
.yActions{margin-top:12px}
/* Коэффициент семян по месяцам */
.factorRow{margin-top:16px}
/* Двенадцать колонок влезают только на широком экране: на 375 px ячейка
   выходит 24 px, и «0,81» обрезается. На телефоне — две строки по шесть. */
.factors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:8px 0}
.factors div{text-align:center;background:var(--card2);border-radius:7px;padding:8px 2px}
.factors b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.factors small{font-size:10px}
@media(min-width:620px){
  .factors{grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
  .factors b{font-size:11px} .factors small{font-size:9px}
}
.factors .cheap{background:#2a3a24} .factors .cheap b{color:var(--mint)}
.factors .now{outline:2px solid var(--gold);outline-offset:-2px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.metric{background:var(--card2);border-radius:10px;padding:10px}
.metric strong{display:block;font-size:17px;margin-top:3px}
.bad{color:var(--danger)} .warnc{color:var(--warn)} .good{color:var(--mint)}
/* Сеять */
.crop{background:var(--card2);border-radius:14px;padding:14px;margin:10px 0;border-left:5px solid var(--line)}
.crop.best{border-left-color:var(--gold)}
.crop.open{border-left-color:var(--green)}
.crop.shut{opacity:.5}
.crop h4{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
.crop h4 i{width:14px;height:14px;border-radius:4px;display:block}
.pros{font-size:13px;line-height:1.6;margin:6px 0 0;padding-left:18px}
/* Магазин */
.kit{display:grid;gap:8px}
.kit div{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--card2);padding:12px;border-radius:11px;font-size:14px}
.kit b{font-weight:600}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;align-self:center}
.tag.have{background:#2a3a24;color:var(--mint)} .tag.need{background:#3d2a1c;color:var(--warn)}
.tag.sell{background:#3a2420;color:var(--danger)}
/* Вложенные вкладки разделов. Выделение намеренно зелёное, как у страниц пульта:
   золотой оставлен верхней навигации, чтобы уровни не путались. */
.subTabs{margin:14px 0 6px}
.subTabs button{font-size:13px;padding:9px 14px;min-height:auto;color:var(--mute);
  background:var(--card2);border:1px solid var(--line);border-radius:11px}
/* Каталог: выбор и итог */
.pick{cursor:pointer;border:1px solid transparent;transition:border-color .12s,background .12s}
.pick:active{background:#222a1c}
.pick.picked{border-color:var(--mint);background:#1d2a1c}
.pick .why{color:var(--mute);margin-top:4px}
.badge{font-style:normal;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
  background:#3a3016;color:var(--gold);padding:2px 7px;border-radius:20px;margin-left:6px;white-space:nowrap}
.totalBar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;
  padding:16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);opacity:.5}
.totalBar.on{opacity:1;border-color:var(--gold)}
.totalBar b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:3px}
.totalBar .after{text-align:right}
/* Таблица цен на культуры */
.priceHead{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:10px;padding:0 4px 8px;
  font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.priceRow{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:10px;align-items:center;
  background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px}
.pName{display:flex;align-items:center;gap:9px;min-width:0}
.pName i{width:13px;height:13px;border-radius:4px;flex:none}
.pName b{font-size:15px} .pName small{font-size:11px}
.pNow b,.pBest b{font-size:17px;font-variant-numeric:tabular-nums}
.pNow small,.pBest small{font-size:11px}
.pFoot{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:9px;margin-top:2px;
  border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.pFoot b{color:var(--ink)}
@media(max-width:520px){
  .priceHead{display:none}
  .priceRow{grid-template-columns:1fr 1fr}
  .pName{grid-column:1 / -1}
}
/* Письма */
.letter{background:var(--paper);color:var(--paperInk);border-radius:6px;padding:26px 24px;margin:14px 0;
  font-family:"Courier New",ui-monospace,monospace;line-height:1.7;box-shadow:0 10px 30px #0006;
  background-image:repeating-linear-gradient(#0000 0 26px,#3a322611 26px 27px)}
.letter .lh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  border-bottom:1px solid #3a322633;padding-bottom:10px;margin-bottom:14px;opacity:.7}
.letter h4{margin:0 0 12px;font-size:17px;letter-spacing:.5px}
.letter p{margin:10px 0;font-size:14px}
.letter .sig{margin-top:18px;font-style:italic;opacity:.75;font-size:13px}
/* Календарь */
.cal{overflow-x:auto}
.calGrid{display:grid;grid-template-columns:104px repeat(12,minmax(30px,1fr));gap:3px;min-width:560px;align-items:center}
.calGrid .mh{font-size:10px;color:var(--mute);text-align:center;padding-bottom:4px}
.calGrid .mh.now{color:var(--gold);font-weight:700}
.calGrid .rn{font-size:13px;display:flex;align-items:center;gap:7px}
.calGrid .rn i{width:11px;height:11px;border-radius:3px;display:block;flex:none}
.cell{height:26px;border-radius:5px;background:#1b2016}
.cell.sow{background:var(--gold)} .cell.grow{background:#3c5a2e} .cell.harv{background:var(--danger)}
.cell.now{outline:2px solid #fff6;outline-offset:-2px}
.calKey{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.calKey span{display:flex;align-items:center;gap:6px}
.calKey i{width:12px;height:12px;border-radius:3px;display:block}
/* Пульт */
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.tabs button{font-size:13px;padding:9px 13px;min-height:auto}
.tabs button.on{background:var(--green);color:#111508;border-color:var(--green);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{min-height:92px;font-weight:600;font-size:15px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:6px;line-height:1.25}
.act small{font-size:11px;color:var(--mute)}
.act .k{font-size:10px;color:var(--gold);letter-spacing:1px}
.act.on{background:#1d3a24;border:2px solid var(--mint)}
.gauges{display:flex;justify-content:space-around;text-align:center;margin:4px 0 10px}
.gauges strong{display:block;font-size:46px;font-variant-numeric:tabular-nums;line-height:1.05}
.gauges small{font-size:10px;letter-spacing:1px}
.rpm{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;margin:6px 0}
progress{width:100%;height:9px;accent-color:var(--green)}
.note{font-size:12px;color:var(--mute);line-height:1.6;border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
[hidden]{display:none!important}
@media(min-width:760px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
  .money{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
  .split .card{margin-bottom:0}
}

// чтобы не пришлось ничего дописывать руками.
function promptText(){
  const mine = FIELDS.filter(f=>f.mine).map(f=>{
    const c = CROPS[f.crop], stage = stageOf(f);
    // На пустом поле состояние уже и есть «вспахано» — второй раз не повторяем.
    const plow = stage.includes("вспахано") ? "" : `, ${f.plow ? "вспахано" : "не вспахано"}`;
    return `  - Поле ${f.id}, ${String(f.ha).replace(".",",")} га: ${c.ru.toLowerCase()}, ${stage}; `
      + `сорняки ${f.weed} из 9, известь ${f.lime} из 3, удобрение ${f.spray} из 3${plow}`;
  }).join("\n");
  const sowable = Object.entries(CROPS)
    .filter(([k,v])=>k!=="UNKNOWN" && v.sow.includes(NOW)).map(([,v])=>v.ru.toLowerCase()).join(", ");
  return `Ты — Весельчак, финансовый агент моей фермы. Не сосед и не приятель: тебе платят за то,
чтобы ферма не разорилась, поэтому каждый совет ты в конце сводишь к деньгам — во что это встанет,
что принесёт, что будет стоить бездействие. Говоришь коротко, по делу, с сухим британским юмором,
но первая строка каждого совета всегда отвечает на вопрос «что сделать».
Обращаешься на «вы». Никаких технических терминов и названий файлов.

Составь план на сезон для моей фермы в Farming Simulator 25 и верни его ОДНИМ файлом JSON,
без пояснений до и после.

Положение дел на сегодня:
- Карта Zielonka, ${PERIODS_RU[NOW]} (${MONTHS[NOW]}), день ${DAY}. Сложная экономика.
- Денег ${eur(MONEY)}, кредит ${eur(LOAN)}.
- Мои поля:
${mine}
- Техника: трактор 160 л.с., трактор 116 л.с., комбайн с зерновой жаткой 6 м,
  сеялка 4,6 м, культиватор 4 м, прицеп-самосвал.
- Чего нет: разбрасывателя извести, катка, опрыскивателя, разбрасывателя удобрений,
  сажалки и уборщика корнеплодов.
- Сеять в этом месяце можно: ${sowable}.
- Пшеница сейчас ${PRICE.WHEAT[NOW]} € за 1000 л, это минимум года; в январе ${Math.max(...PRICE.WHEAT)} €.

Требования к плану:
- От 4 до 8 задач. priority: 1 — горит сейчас, 2 — важно, 3 — можно позже.
- В каждой задаче поле why объясняет причину простыми словами, поле kit — чем это делать
  и есть ли оно у меня.

function weedWord(v){ return v===0?"чисто" : v<=2?"единичные" : v<=5?"заметно" : "много"; }
function limeWord(v){ return v===0?"кислая земля" : v===1?"мало" : v===2?"нормально" : "хорошо"; }

function stat(name, value, max, word, cls, delta){
  const pct = Math.round(value/max*100);
  // Стрелку тоже в процентах: рядом с «100 %» голое «2» читается как другая единица.
  // У сорняков рост — это плохо, у остальных наоборот, поэтому цвет считается
  // с учётом направления, а не просто «вверх красный».
  const worseUp = name === "Сорняки";
  const deltaPct = delta ? Math.round(delta/max*100) : 0;
  const arrow = deltaPct ? `<span class="delta ${(delta>0)===worseUp?"bad":"good"}">
      ${delta>0?"↑":"↓"}${Math.abs(deltaPct)} %</span>` : "";
  return `<div class="stat">
    <div class="statTop"><span>${name}</span>${arrow}</div>
    <strong class="${cls}">${pct} %</strong>
    <div class="lvl"><i class="${cls}" style="width:${pct}%"></i></div>
    <small>${word}</small>
  </div>`;
}

// ───── Урожай: ожидание до уборки, факт после ─────
//
// Точно известны только две вещи: урожайность культуры из файлов игры
// (пшеница — 0,89 л/м²) и площадь поля, которую отдаёт мод. Множители за
// удобрение, известь и сорняки игра считает внутри себя, в закрытом архиве,
// поэтому здесь они названы прикидкой и показаны отдельными строками —
// чтобы видно было, откуда взялось число, и чтобы никто не принял его
// за обещание.
const PENALTY = [
  {id:"fert", name:"Не удобряли",      test:f=>f.spray===0, cut:0.25},
  {id:"half", name:"Удобрили частично",test:f=>f.spray===1, cut:0.12},
  {id:"lime", name:"Известь на нуле",  test:f=>f.lime===0,  cut:0.15},
  {id:"weed", name:"Сорняки",          test:f=>f.weed>=6,   cut:0.20},
  {id:"weed2",name:"Немного сорняков", test:f=>f.weed>=3&&f.weed<6, cut:0.08},
];

// Фактический сбор: мод пишет его сам, без мода вводится руками и здесь же хранится.
const actuals = JSON.parse(localStorage.getItem("fs25yield") || "{}");
const saveActuals = () => localStorage.setItem("fs25yield", JSON.stringify(actuals));

function yieldOf(f){
  const c = CROPS[f.crop];
  if(!c || !f.ha || !c.yield) return null;
  const base = Math.round(c.yield * f.ha * 10000);
  const hits = PENALTY.filter(p => p.test(f));
  const keep = hits.reduce((k,p) => k * (1 - p.cut), 1);
  const expect = Math.round(base * keep);
  const price = PRICE[f.crop] ? PRICE[f.crop][NOW] : 0;
  return {base, hits, expect, lost: base - expect,
          money: Math.round(expect * price / 1000),
          actual: actuals[f.id] ?? null};
}

function yieldBlock(f){
  const y = yieldOf(f); if(!y) return "";
  const ready = f.ground.startsWith("HARVEST_READY");
  const pct = y.actual ? Math.round(y.actual / y.expect * 100) : 0;
  return `
  <h3>${y.actual ? "Итог по урожаю" : ready ? "Ожидаемый урожай" : "Сколько ждать"}</h3>
  <div class="yield">
    <div class="yTop">
      <div><small>${y.actual?"Ожидали":"Выйдет примерно"}</small><b>${fmt(y.expect)} л</b></div>
      ${y.actual
        ? `<div class="yAct"><small>Вышло</small>
             <b class="${pct>=95?"good":pct>=80?"warnc":"bad"}">${fmt(y.actual)} л</b>
             <span class="yPct ${pct>=95?"good":pct>=80?"warnc":"bad"}">${pct} %</span></div>`
        : `<div class="yAct"><small>Это примерно</small><b class="good">${eur(y.money)}</b></div>`}
    </div>
    <div class="yBase">С ${String(f.ha).replace(".", ",")} га по-хорошему вышло бы ${fmt(y.base)} л</div>
    ${y.hits.length ? y.hits.map(p=>`
      <div class="yRow"><span>${p.name}</span><b class="bad">−${Math.round(p.cut*100)} %</b></div>`).join("")
      : `<div class="yRow"><span>Поле в порядке, терять нечего</span><b class="good">—</b></div>`}
    ${y.hits.length?`<div class="yRow total"><span>Недобор</span><b class="bad">${fmt(y.lost)} л</b></div>`:""}
    ${y.actual
      ? `<small>${pct>=95?"Сошлось с ожиданием.":pct>=80?"Чуть хуже ожидания — обычное дело."
          :"Заметно хуже ожидания. Стоит проверить, не потерялась ли часть при выгрузке."}</small>`
      : `<small>Это прикидка: точные множители игра держит в себе. Число показывает,
         на что рассчитывать, и что именно съедает разницу.</small>`}
    <div class="yActions">
      ${y.actual
        ? `<button class="jump" data-clear="${f.id}">Убрать введённое</button>`
        : ready ? `<button class="jump" data-enter="${f.id}">Записать, сколько вышло</button>` : ""}
    </div>
  </div>`;
}

  if(f.ground.startsWith("HARVEST_READY")) return "готово к уборке";

}
function nextOp(f){
  const c = CROPS[f.crop]||CROPS.UNKNOWN;
  if(f.ground.startsWith("HARVEST_READY")){

    return {op:"Убирать, и поскорее", urg:wither?"urgent":"soon",

      kit:"Нужен разбрасыватель извести, у вас его пока нет"};
    const open = Object.entries(CROPS).filter(([k,v])=>v.sow.includes(NOW)&&k!=="UNKNOWN").map(([k])=>CROPS[k].ru);
    return {op:"Можно сеять", urg:"soon", why:`Поле готово. В ${MONTHS[NOW]}е сюда пойдёт: ${open.join(", ")}.`,
      kit:"Ваша сеялка подходит"};
  }
  if(f.weed>=6) return {op:"Опрыскать от сорняков", urg:"soon",
    why:`Сорняков много — ${f.weed} из 9. Оставите так, соберёте заметно меньше.`,
    kit:"Нужен опрыскиватель, у вас его пока нет"};
  if(f.spray===0) return {op:"Подкормить удобрением", urg:"ok",
    why:"Поле не удобрено. Подкормите — соберёте ощутимо больше с той же площади.",
    kit:"Нужен разбрасыватель удобрений, у вас его пока нет"};
  return {op:"Ничего не делать", urg:"ok",
    why:`${CROPS[f.crop].ru} растёт как надо. Лезть сюда сейчас незачем.`, kit:""};
}

    const p=e.target.closest("polygon"); if(p){ selField=+p.dataset.id; render(); } };
  // Только на пульте: подвкладки «Культур» и «Техники» тоже носят класс .tabs,
  // и без проверки этот обработчик цеплялся к ним. Клик по подвкладке писал
  // в deckPage значение undefined, после чего пульт переставал открываться.
  // В режиме «в поле» страниц кнопок нет, поэтому узла может не быть вовсе.
  const pageTabs = tab === "deck" ? main.querySelector(".tabs") : null;
  if(pageTabs) pageTabs.onclick = e => {
    const b = e.target.closest("button");
    if(b?.dataset.p) { deckPage = b.dataset.p; render(); } };
  // «Кнопки на пульте →» уводит из задачи прямо на нужную страницу пульта.
  // Класс .jump носят и другие мелкие кнопки — показать пример, записать урожай.
  // Поэтому отбор только по наличию страницы, иначе этот обработчик затирал бы их:
  // он идёт последним, а onclick присваивается, а не добавляется.
  main.querySelectorAll(".jump[data-p]").forEach(b => b.onclick = () => {
    deckPage = b.dataset.p; tab = "deck"; render(); window.scrollTo(0,0); });
  main.querySelectorAll(".tick input").forEach(c => c.onchange = () => {
    c.checked ? ticked.add(c.dataset.id) : ticked.delete(c.dataset.id);
    saveTicks(); render(); });
  const fm = main.querySelector("#fieldMode");
  if(fm) fm.onclick = () => { fieldMode = !fieldMode; render(); };
  const wd = main.querySelector("#workDemo");
  if(wd) wd.onclick = () => { workState = (workState + 1) % WORK.length; render(); };
  main.querySelectorAll(".act").forEach(b=>{
    b.onpointerdown=()=>b.classList.add("down"); b.onpointerup=()=>b.classList.remove("down");
    b.onpointerleave=()=>b.classList.remove("down");
  });
}

const PRI_CLASS = {1:"urgent", 2:"soon", 3:"ok", 0:"done"};

// Часть задач приложение вычёркивает само — поле вспахано, засеяно, убрано.
// Но поездку в магазин оно не увидит, поэтому галочка ставится руками
// и переживает перезапуск.
const ticked = new Set(JSON.parse(localStorage.getItem("fs25done") || "[]"));
const saveTicks = () => localStorage.setItem("fs25done", JSON.stringify([...ticked]));
const isDone = t => t.pri === 0 || ticked.has(t.id);

function taskHtml(t){
  // Заголовок часто уже называет поле — не повторяем номер дважды.
  const f = t.field && !t.title.includes(String(t.field)) ? ` · поле ${t.field}` : "";
  const jump = t.page ? `<button class="jump" data-p="${t.page}">Кнопки на пульте →</button>` : "";
  const done = isDone(t), auto = t.pri === 0;
  return `<div class="task ${done?"done":PRI_CLASS[t.pri]}">
    <div class="bar"></div>
    <div>
      <label class="tick ${auto?"auto":""}">
        <input type="checkbox" data-id="${t.id}" ${done?"checked":""} ${auto?"disabled":""}>
        <b>${t.title}${f}</b>
      </label>
      <small>${t.why}</small>
      ${t.kit?`<small class="kit">${t.kit}</small>`:""}
      <div class="taskFoot">
        <span class="chip ${t.src}">${t.src==="plan"?"из плана Весельчака":"заметил сам"}</span>
        ${auto?'<span class="chip">вычеркнулось само</span>':""}${jump}
      </div>
    </div>
  </div>`;
}

function fields(){
  // Схематичная раскладка. Настоящие контуры полей выгрузит Lua-мод —
  // в файлах сейва они лежат в закрытом формате .grle.
  const cols=6, w=100, h=68, gap=8;
  let poly="", i=0;
  for(const f of FIELDS){
    const cx=(i%cols)*(w+gap)+10, cy=Math.floor(i/cols)*(h+gap)+10, s=(n)=>((f.id*7+n*13)%9)-4;
    const pts=[[cx+s(1),cy+s(2)],[cx+w+s(3),cy+s(4)],[cx+w+s(5),cy+h+s(6)],[cx+s(7),cy+h+s(8)]]
      .map(p=>p.join(",")).join(" ");
    const cls=[f.mine?"mine":"", f.id===selField?"sel":""].filter(Boolean).join(" ");
    poly+=`<polygon points="${pts}" fill="${CROPS[f.crop].c}" class="${cls}" data-id="${f.id}"/>
      <text x="${cx+6}" y="${cy+16}">${f.id}${f.mine?" ★":""}</text>`;
    i++;
  }
  const rows=Math.ceil(FIELDS.length/cols);
  const f=FIELDS.find(x=>x.id===selField), c=CROPS[f.crop], o=nextOp(f);
  const seen=[...new Set(FIELDS.map(x=>x.crop))];
  return `<div class="split">
    <div class="card">
      <h2>Поля</h2>
      <small>Цвета те же, что на карте в самой игре. ★ — ваши участки. Нажмите поле.</small>
      <svg class="map" viewBox="0 0 ${cols*(w+gap)+12} ${rows*(h+gap)+12}">${poly}</svg>
      <div class="legend">${seen.map(k=>`<span><i style="background:${CROPS[k].c}"></i>${CROPS[k].ru}</span>`).join("")}</div>
      <p class="note">Формы пока условные — настоящие очертания полей и их размер в гектарах
      появятся позже.</p>
    </div>
    <div class="card">
      <span class="eyebrow">Поле ${f.id}${f.mine?" · ваше":" · чужое"}</span>
      <h2 style="display:flex;align-items:center;gap:9px">
        <i style="width:16px;height:16px;border-radius:4px;background:${c.c};display:block"></i>${c.ru}</h2>
      <small>${stageOf(f)}</small>
      <div class="gauge4">
        ${stat("Сорняки", f.weed, 9, weedWord(f.weed), f.weed>=6?"bad":f.weed>=3?"warnc":"good", CHANGE[f.id]?.weed)}
        ${stat("Известь", f.lime, 3, limeWord(f.lime), f.lime===0?"bad":f.lime>=2?"good":"warnc", CHANGE[f.id]?.lime)}
        ${stat("Удобрение", f.spray, 3, f.spray===0?"не вносили":f.spray>=2?"хватает":"мало",
               f.spray===0?"warnc":"good", CHANGE[f.id]?.spray)}
        ${stat("Вспашка", f.plow?1:0, 1, f.plow?"вспахано":"не вспахано", f.plow?"good":"warnc")}
      </div>
      <div class="task ${o.urg}"><div class="bar"></div><div>
        <b>${o.op}</b><small>${o.why}</small><span class="chip">${o.kit}</span></div></div>
      ${yieldBlock(f)}
      ${PRICE[f.crop]?`<h3>Цена за 1000 литров</h3>
        <div class="metrics"><div class="metric"><small>Сейчас (${MSHORT[NOW]})</small>
        <strong class="${PRICE[f.crop][NOW]<=Math.min(...PRICE[f.crop])?"bad":""}">${PRICE[f.crop][NOW]} €</strong></div>
        <div class="metric"><small>Пик (${MSHORT[PRICE[f.crop].indexOf(Math.max(...PRICE[f.crop]))]})</small>

        <small>Разница +${Math.round((Math.max(...PRICE[f.crop])/PRICE[f.crop][NOW]-1)*100)} % — стоит подержать в амбаре до пика.</small>`:""}

}

function sowNow(){
  const open = Object.entries(CROPS).filter(([k,v])=>k!=="UNKNOWN"&&v.sow.includes(NOW));
  const next = Object.entries(CROPS).filter(([k,v])=>k!=="UNKNOWN"&&v.sow.includes((NOW+1)%12));
  const shut = Object.entries(CROPS).filter(([k,v])=>k!=="UNKNOWN"&&!v.sow.includes(NOW)&&!v.sow.includes((NOW+1)%12));
  const seederOk = ["WHEAT","BARLEY","OAT","CANOLA","GRASS","PEA","SPINACH"]; // категория SOWINGMACHINE
  const card=([k,v],cls)=>{
    const fits=seederOk.includes(k), pk=PRICE[k]?Math.max(...PRICE[k]):0;
    return `<div class="crop ${cls}">
      <h4><i style="background:${v.c}"></i>${v.ru}</h4>
      <ul class="pros">
        <li>Семена: <b>${seedCost(k)} €/га</b> (${Math.round(v.seed*10000)} л/га)</li>
        ${pk?`<li>Выручка на пике: <b>${eur(revenue(k,PRICE[k].indexOf(pk)))}/га</b></li>`:""}
        <li>${fits?"Сеялка Great Plains 1500 подходит":"<b>Сеялка не подходит</b> — нужна другая"}</li>
        ${v.roll?"<li>После посева нужно прикатывание — <b>катка нет</b></li>":""}
        ${v.lime?"<li>Требует извести для роста</li>":""}
      </ul></div>`;
  };
  return `
    <h3>Можно сейчас</h3>
    ${open.map((e,i)=>card(e,i===0?"best":"open")).join("")}
    <h3>Откроется в ${MONTHS[(NOW+1)%12]}е</h3>
    ${next.filter(([k])=>!CROPS[k].sow.includes(NOW)).map(e=>card(e,"open")).join("")}
    <h3>Закрыто до весны</h3>
    <p><small>${shut.map(([k,v])=>v.ru).join(" · ")}</small></p>
    <p class="note">Рекомендация: <b>канола на поле 45</b>. Семян всего ${seedCost("CANOLA")} €/га против
    ${seedCost("WHEAT")} €/га у пшеницы, а платят за неё вдвое больше. Убирать в июне-июле —
    зерновая жатка справится. Но сначала известь: уровень на поле 45 нулевой.</p>`;
}

function priceTable(){
  const seederOk = ["WHEAT","BARLEY","OAT","CANOLA","GRASS","PEA","SPINACH"];
  const rows = Object.keys(PRICE).map(k=>{
    const p = PRICE[k], now = p[NOW], max = Math.max(...p), bestM = MONTHS[p.indexOf(max)];
    return {k, now, max, bestM, up:Math.round((max/now-1)*100),
            rev:revenue(k, p.indexOf(max)), seed:seedCost(k), fits:seederOk.includes(k)};
  // Сначала то, что вы реально можете посеять своей сеялкой, и внутри — по выручке.
  // Иначе список возглавляет свёкла, которую этим парком не вырастить.
  }).sort((a,b) => (a.fits?0:1)-(b.fits?0:1) || b.rev-a.rev);
  return `
  <div class="priceHead"><span>Культура</span><span>Сейчас</span><span>Лучше всего</span></div>
  ${rows.map(r=>`
    <div class="priceRow">
      <div class="pName"><i style="background:${CROPS[r.k].c}"></i>
        <div><b>${CROPS[r.k].ru}</b><small>${r.fits?"сеялка подходит":"нужна другая сеялка"}</small></div></div>
      <div class="pNow"><b>${r.now} €</b><small>за 1000 л</small></div>
      <div class="pBest"><b class="good">${r.max} €</b><small>${r.bestM} · +${r.up} %</small></div>
      <div class="pFoot">
        <span>Семена <b>${r.seed} €/га</b></span>
        <span>Выручка на пике <b class="good">${eur(r.rev)}/га</b></span>
      </div>
    </div>`).join("")}
  <h3>Расходники · за 1000 литров</h3>
  <small>Тысяча литров — это один биг-бэг, которым их и покупают</small>
  <div class="kit">
    <div><span><b>Семена</b><small>${MONTHS[NOW]}: коэффициент ${dec(SEASON_FACTOR[NOW])}${
      SEASON_FACTOR[NOW]===Math.min(...SEASON_FACTOR)?" — минимум года":""}</small></span>
      <span class="tag need">${Math.round(SEED_PRICE*SEASON_FACTOR[NOW]*1000)} €</span></div>
    <div><span><b>Удобрение</b><small>цена не зависит от месяца</small></span>
      <span class="tag need">${Math.round(FERT_PRICE*1000)} €</span></div>
    <div><span><b>Известь</b><small>цена не зависит от месяца · самое дешёвое здесь</small></span>
      <span class="tag need">${Math.round(LIME_PRICE*1000)} €</span></div>
  </div>
  <div class="factorRow">
    <span class="eyebrow">Коэффициент семян по месяцам</span>
    <div class="factors">${SEASON_FACTOR.map((v,i)=>`
      <div class="${i===NOW?"now":""} ${v===Math.min(...SEASON_FACTOR)?"cheap":""}">
        <b>${dec(v)}</b><small>${MSHORT[i]}</small></div>`).join("")}</div>
    <small>Семена дорожают и дешевеют вместе с зерном. Сейчас ${MONTHS[NOW]} — минимум года,
    покупать выгоднее всего именно теперь.</small>
  </div>
  <p class="note">Выручка посчитана по урожайности культуры и цене в лучший месяц.
  Реальный сбор ниже, если поле не удобрено или заросло сорняками.</p>`;
}

function letters(){
  return `<div class="card tight">
    <h2 style="padding:6px 6px 0">Письма Весельчака</h2>
    <small style="padding:0 6px 6px">Пишутся заранее и грузятся вместе с планом сезона</small>
    ${LETTERS.map(l=>`<div class="letter">
      <div class="lh"><span>${l.date}</span><span>Diddly Squat</span></div>
      <h4>${l.subj}</h4>
      ${l.body.map(p=>`<p>${p}</p>`).join("")}
      <div class="sig">${l.sig}</div>
    </div>`).join("")}
  </div>`;
}

function cal(){
  const rows=["WHEAT","BARLEY","CANOLA","OAT","POTATO","SUGARBEET"];
  // рост от посева до готовности — упрощённо, по числу состояний культуры
  const grow={WHEAT:[8,9,10,11,0,1,2,3],BARLEY:[8,9,10,11,0,1,2,3],CANOLA:[7,8,9,10,11,0,1,2],
              OAT:[2,3,4],POTATO:[2,3,4,5],SUGARBEET:[2,3,4,5,6,7]};
  const harv={WHEAT:[4,5],BARLEY:[4,5],CANOLA:[3,4],OAT:[4,5],POTATO:[6,7],SUGARBEET:[8,9]};
  return `<div class="card">
    <h2>Календарь года</h2>
    <small>Сроки посева точные, взяты из игры. Рост и уборка показаны примерно.</small>
    <div class="cal"><div class="calGrid">
      <div></div>${MSHORT.map((m,i)=>`<div class="mh ${i===NOW?"now":""}">${m}</div>`).join("")}
      ${rows.map(k=>`<div class="rn"><i style="background:${CROPS[k].c}"></i>${CROPS[k].ru}</div>
        ${MSHORT.map((_,i)=>{
          const cls=CROPS[k].sow.includes(i)?"sow":(harv[k]||[]).includes(i)?"harv":(grow[k]||[]).includes(i)?"grow":"";
          return `<div class="cell ${cls} ${i===NOW?"now":""}"></div>`;}).join("")}`).join("")}
    </div></div>
    <div class="calKey">
      <span><i style="background:var(--gold)"></i>сеять</span>
      <span><i style="background:#3c5a2e"></i>растёт</span>
      <span><i style="background:var(--danger)"></i>убирать</span>
      <span><i style="outline:2px solid #fff6;background:#1b2016"></i>сейчас</span>
    </div>
    <p class="note">Видно главное: пшеница и ячмень — озимые, их сеют осенью. Канола ловится
    в августе-сентябре. Всё весеннее закрыто до марта.</p>
  </div>`;
}

function deck(){
  const pages=Object.keys(DECK);
  // За рулём полезна задача, которую делают отсюда же. Поездка в магазин
  // подождёт, поэтому дела с кнопками на пульте идут первыми.
  const now = SEASON_PLAN.filter(t=>!isDone(t))
    .sort((a,b) => (a.page?0:1)-(b.page?0:1) || a.pri-b.pri)[0];
  const toggle = `<button id="fieldMode" class="modeSwitch ${fieldMode?"on":""}">
    <span>${fieldMode?"◧":"▣"}</span>${fieldMode?"Обычный вид":"Режим в поле"}</button>`;

  // Смысл этого режима — не крупная скорость, а честный ответ на вопрос
  // «я сейчас вообще работаю или еду впустую». Поднятое орудие и выключенный
  // агрегат — то, на чём новичок теряет целые проходы.
  if(fieldMode){
    const w = WORK[workState];
    const bar = (v,cls="") => `<div class="lvl ${cls}"><i style="width:${v}%"></i></div>`;
    return `<div class="card">
      ${toggle}
      <button id="workDemo" class="status ${w.ok?"go":"stop"}">
        <b>${w.head}</b><small>${w.why}</small>
      </button>
      <div class="doing">${w.doing}</div>
      <div class="levels">
        <div><span>Семена</span>${bar(78)}<b>78 %</b><small>ещё около полутора проходов</small></div>
        <div><span>Топливо</span>${bar(62)}<b>62 %</b><small>до конца поля хватит</small></div>
        <div><span>Скорость</span>${bar(60,"speed")}<b>12 км/ч</b><small>для сеялки в самый раз</small></div>
      </div>
      <div class="grid bigGrid">
        <button class="act ${w.lowered?"on":""}">ОПУСТИТЬ /<br>ПОДНЯТЬ<span class="k">V</span></button>
        <button class="act ${w.running?"on":""}">ВКЛЮЧИТЬ<br>АГРЕГАТ<span class="k">B</span></button>
        <button class="act">ПОМОЩНИК<span class="k">H</span></button>
        <button class="act">РАЗГРУЗИТЬ<span class="k">I</span></button>
      </div>
      ${now?`<div class="nextLine"><span class="eyebrow">Потом</span>${now.title}</div>`:""}
    </div>`;
  }

  return `<div class="card">
    ${toggle}
    <div class="gauges">
      <div><strong>12</strong><small>КМ/Ч</small></div>
      <div><strong>4</strong><small>ПЕРЕДАЧА</small></div>
      <div><strong>78</strong><small>% ТОПЛИВА</small></div>
    </div>
    <div class="rpm">1 450 / 2 200 об/мин</div>
    <progress value="0.66"></progress>
    <small style="margin-top:10px">Challenger MT600 · сеялка Great Plains 1500 опущена, агрегат включён</small>
  </div>
  <div class="card">
    <h2>Пульт</h2>
    <small>Клавиши берутся из ваших настроек управления в игре. Подсвечено то, что сейчас включено.</small>
    <div class="tabs" style="margin-top:14px">
      ${pages.map(p=>`<button data-p="${p}" class="${p===deckPage?"on":""}">${p}</button>`).join("")}
    </div>
    <div class="grid">
      ${DECK[deckPage].map(([l,d,k,on,g])=>`<button class="act ${on?"on":""} ${g==="hold"?"holdBtn":""}">
        ${g==="hold"?'<span class="gest">удерживать</span>':""}
        <span>${l}</span><small>${d}</small><span class="k">${k}</span></button>`).join("")}
    </div>
    <p class="note">В этой игре одна клавиша делает разное в зависимости от того, чем вы управляете:
    та же кнопка опускает сеялку у трактора и отцепляет трос у лебёдки. Подписи названы по работе
    в поле — это то, чем вы будете заниматься почти всегда.</p>
  </div>`;
}

render();
</script>
</body>
</html>
